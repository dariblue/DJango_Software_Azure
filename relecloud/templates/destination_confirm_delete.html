{% extends 'base.html' %}

{% block title %}
ReleCloud - Confirmar eliminacion
{% endblock title %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white">
                <h3 class="h5 mb-0">Confirmar eliminacion</h3>
            </div>
            <div class="card-body">
                <p class="lead">¿Estas seguro de que deseas borrar el destino <strong>"{{ object.name }}"</strong>?</p>
                <p class="text-danger"><small>Esta accion no se puede deshacer.</small></p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Confirmar borrado</button>
                    <a href="{% url 'destination_detail' object.pk %}" class="btn btn-outline-secondary ms-2">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
